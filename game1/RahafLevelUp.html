<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAHAF.EXE — Firewall Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0D1321;
    --bg-deep: #080C16;
    --panel: #121A2B;
    --panel-edge: #23304a;
    --text: #EAEFFA;
    --muted: #7C8AA5;
    --accent: #3DDC84;
    --accent-dim: #22623f;
    --amber: #FFB454;
    --danger: #FF5C5C;
    --font-pixel: 'Press Start 2P', monospace;
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }

  :root:not([data-theme="light"]){ color-scheme: dark; }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#0D1321; --bg-deep:#080C16; --panel:#121A2B; --panel-edge:#23304a;
      --text:#EAEFFA; --muted:#8291ab; --accent:#2fbd71; --accent-dim:#1c4d33; --amber:#e79a3a; --danger:#e14545;
    }
  }

  *{ box-sizing: border-box; }
  html,body{
    height:100%; margin:0; background: var(--bg-deep); color: var(--text);
    font-family: var(--font-mono);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overscroll-behavior: none;
  }

  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    background:
      radial-gradient(circle at 12% 10%, rgba(61,220,132,0.08), transparent 45%),
      radial-gradient(circle at 88% 90%, rgba(255,180,84,0.06), transparent 40%),
      var(--bg-deep);
    overflow-x:hidden;
  }
  #app{ width:100%; max-width:980px; padding:18px 14px 28px; }
 
  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-pixel); font-size:9px; color:var(--muted);
    letter-spacing:0.5px; margin-bottom:10px; line-height:1.6;
  }
  .titlebar .dot{ color: var(--accent); }
  .hud{ font-family:var(--font-pixel); font-size:9px; color:var(--text); }
  .hud span{ color: var(--amber); }

  .term{
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45); overflow:hidden;
  }
  .term-bar{
    display:flex; align-items:center; gap:6px; padding:9px 12px;
    background: linear-gradient(180deg, #16203a, #101828); border-bottom:1px solid var(--panel-edge);
    font-family:var(--font-mono); font-size:11px; color:var(--muted);
  }
  .term-bar .tdot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .term-bar .tdot:nth-child(1){ background:#FF5F56; }
  .term-bar .tdot:nth-child(2){ background:#FFBD2E; }
  .term-bar .tdot:nth-child(3){ background:#27C93F; }
  .term-bar .path{ margin-left:8px; }
 
  .hero{ padding: 28px 22px 24px; }
  .hero h1{
    font-family:var(--font-pixel); font-size: clamp(15px, 4vw, 24px); line-height:1.7;
    margin: 0 0 12px; color: var(--accent); text-shadow: 0 0 18px rgba(61,220,132,0.35);
  }
  .hero p{ color: var(--muted); font-size:14px; line-height:1.7; max-width:62ch; margin:0 0 18px;}
  .cursor{ display:inline-block; width:9px; height:16px; background:var(--accent); vertical-align:-2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .start-btn{
    font-family:var(--font-pixel); font-size:11px; color:var(--bg-deep); background: var(--accent);
    border:none; padding:14px 20px; border-radius:6px; cursor:pointer; letter-spacing:0.5px;
    box-shadow: 0 6px 0 var(--accent-dim); transition: transform .08s ease;
  }
  .start-btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dim); }
  .track{ margin-top: 28px; padding: 4px 0 4px 18px; border-left: 2px dashed var(--panel-edge); display:flex; flex-direction:column; gap:16px; }
  .node{ position:relative; display:flex; align-items:center; gap:12px; cursor:pointer; padding:10px 12px; border-radius:8px; border:1px solid transparent; }
  .node::before{ content:''; position:absolute; left:-24px; top:50%; transform:translateY(-50%); width:10px; height:10px; border-radius:50%; background: var(--panel-edge); border: 2px solid var(--bg-deep); }
  .node.done::before{ background: var(--accent); }
  .node.locked{ opacity:0.45; cursor:not-allowed; }
  .node:not(.locked):hover{ background: rgba(61,220,132,0.06); border-color: var(--panel-edge); }

  .node .tag{ font-family:var(--font-pixel); font-size:8px; color:var(--bg-deep); background: var(--amber); padding:4px 6px; border-radius:4px; white-space:nowrap; }
  .node.done .tag{ background: var(--accent); }
  .node .meta{ display:flex; flex-direction:column; }
  .node .meta b{ font-size:14px; font-weight:600; }
  .node .meta small{ color:var(--muted); font-size:11.5px; }
  .node .check{ margin-left:auto; color:var(--accent); font-family:var(--font-pixel); font-size:12px; }

  #gameWrap{ display:none; }
  #canvasHolder{ position:relative; width:100%; aspect-ratio: 16/9; background:#0a0f1c; border-radius: 0 0 10px 10px; overflow:hidden; }
  canvas{ width:100%; height:100%; display:block; touch-action:none; }
 
  .ingame-hud{
    position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between;
    align-items:flex-start; gap:8px; font-family:var(--font-pixel); font-size:8.5px; color:var(--text);
    text-shadow: 0 2px 4px rgba(0,0,0,0.6); flex-wrap:wrap;
  }
  .chip{ background: rgba(8,12,22,0.7); border:1px solid var(--panel-edge); padding:6px 8px; border-radius:6px; backdrop-filter: blur(2px); }
  .chip.amber{ color: var(--amber); }
  .chip.danger{ color: var(--danger); }

  .integrityWrap{ position:absolute; top:34px; left:10px; right:10px; pointer-events:none; }
  .integrityBar{ height:7px; border-radius:4px; background:rgba(8,12,22,0.7); border:1px solid var(--panel-edge); overflow:hidden; }
  .integrityFill{ height:100%; background: linear-gradient(90deg, var(--accent), #7CE0C4); width:100%; transition: width .25s ease, background .25s ease; }
