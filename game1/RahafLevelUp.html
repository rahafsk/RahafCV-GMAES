<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAHAF.EXE — Firewall Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0D1321;
    --bg-deep: #080C16;
    --panel: #121A2B;
    --panel-edge: #23304a;
    --text: #EAEFFA;
    --muted: #7C8AA5;
    --accent: #3DDC84;
    --accent-dim: #22623f;
    --amber: #FFB454;
    --danger: #FF5C5C;
    --font-pixel: 'Press Start 2P', monospace;
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }

  :root:not([data-theme="light"]){ color-scheme: dark; }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#0D1321; --bg-deep:#080C16; --panel:#121A2B; --panel-edge:#23304a;
      --text:#EAEFFA; --muted:#8291ab; --accent:#2fbd71; --accent-dim:#1c4d33; --amber:#e79a3a; --danger:#e14545;
    }
  }

  *{ box-sizing: border-box; }
  html,body{
    height:100%; margin:0; background: var(--bg-deep); color: var(--text);
    font-family: var(--font-mono);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overscroll-behavior: none;
  }

  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    background:
      radial-gradient(circle at 12% 10%, rgba(61,220,132,0.08), transparent 45%),
      radial-gradient(circle at 88% 90%, rgba(255,180,84,0.06), transparent 40%),
      var(--bg-deep);
    overflow-x:hidden;
  }
